[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-bench"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5,<1",
    "sentence-transformers>=3.0,<4",
    "httpx>=0.27,<1",
    "click>=8.1,<9",
    "rich>=13.7,<14",
    "pandas>=2.2,<3",
]

[project.scripts]
rag-eval = "rag.cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
rag = ["eval/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
